<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundo imagem</title>
    <style>
        body{
            background-color: black;
            background-image: url(imagens/wallpaper002.jpg);
            background-position: center top;
            background-repeat: no-repeat;
            
        }
        h1{
            color:white;
            text-align: center;
            font-size:45px;
            margin-bottom: 100px;
            border: 2px solid rgba(0, 0, 0, 0.623);
            box-shadow:10px 5px 5px rgba(0, 0, 0, 0.445);
            background-color: rgba(255, 255, 255, 0.185);
        }
        div.quadrado{
            display: inline-block;
            border: 2px solid black;
            width: 300px;
            height: 300px;
            border-radius: 10px;
            box-shadow: 5px 5px 5px rgba(41, 228, 3, 0.63);
            margin: auto;
            text-align: center;
        }
        #q1{
            background-color: rgb(11, 221, 46);
        }
        #q2{
            background-image: linear-gradient(to bottom, rgb(80, 80, 216), rgba(119, 52, 119, 0.562), rgb(0, 255, 115)) ;
        }
        #q3{
            background-image: url(imagens/pattern001.png);
        }

    </style>
</head>
<body>
    <h1>
        ola mundo
    </h1>
    <div class="quadrado" id="q1">

    </div>
    <div class="quadrado" id="q2">

    </div>
    <div class="quadrado" id="q3">

    </div>
</body>
</html>
