<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, sans-serif;
        }
    table{
        width: 400px;
        border-collapse: collapse;
    }
    caption{
        font-size:1.5em;
        font-weight: bold;
        background-color: #8b8989;
    }
    thead{
        background-color: #4e4747;
    }
    th{
        border: 1px solid black;
        color: white;
       
        }
        td{
            border: 1px solid black;
            padding: 10px;
          
        }
        .cabecalho{
            border: 1px solid black;
        }
        .dados{
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tabelas complexas</h1>
</body>
<table>
    <caption>Federações Estaduais</caption>
    <thead>
            <tr class="cabecalho">
                <th>Estado</th>
                <th>Capital</th>
                
            </tr>
    </thead>
    <tbody>
        <tr class="dados">
             <td>Santa Catarina</td>
            <td>Florianópolis</td>
            </tr>
       <tr class="dados">
            <td>São Paulo</td>
            <td>São Paulo</td>
        </tr>
        <tr class="dados">
            <td>Rio de Janeiro</td>
            <td>Rio de Janeiro</td>
        </tr>
    </tbody>
    <tfoot>

    </tfoot>
</table>
</html>
